services:
  - type: web
    name: saldo-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w api
    startCommand: npm start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
