services:
  - type: web
    name: saldo-api
    runtime: node
    plan: free
    # Mesma região do banco no Neon (AWS us-east-1, Virginia), a mais próxima do Brasil entre as do Render.
    region: virginia
    # --include=dev: TypeScript e tipos são devDependencies, e com NODE_ENV=production o npm os pularia.
    buildCommand: npm ci --include=dev && npm run build -w api
    startCommand: npm start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Só o site do GitHub Pages chama a API pelo navegador (o APK entra sempre, pelo código).
      - key: CORS_ORIGIN
        value: https://alanfmf.github.io
      - key: AI_KEY_SECRET
        generateValue: true
      # Assistente pelo WhatsApp (Cloud API da Meta). Sem esses valores, o WhatsApp fica desligado.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
