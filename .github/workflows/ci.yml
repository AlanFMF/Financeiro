name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saldo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (API e web)
        run: npm run typecheck
      - name: Testes da API (PGlite)
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrações e fumaça no PostgreSQL 16
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saldo
          JWT_SECRET: ci
          PORT: 3333
        run: |
          node api/dist/index.js &
          for i in $(seq 1 20); do curl -sf localhost:3333/api/health && break; sleep 1; done
          curl -sf -XPOST localhost:3333/api/auth/demo -H 'content-type: application/json' -d '{}' > /dev/null
