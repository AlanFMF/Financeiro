name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saldo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (API e web)
        run: npm run typecheck
      - name: Testes (API com PGlite e web)
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrações e fumaça no PostgreSQL 16
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/saldo
          JWT_SECRET: ci
          PORT: 3333
        run: |
          node api/dist/index.js &
          for i in $(seq 1 20); do curl -sf localhost:3333/api/health && break; sleep 1; done
          TOKEN=$(curl -sf -XPOST localhost:3333/api/auth/demo -H 'content-type: application/json' -d '{}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          MES=$(date +%Y-%m)
          curl -sf "localhost:3333/api/budgets?month=$MES" -H "authorization: Bearer $TOKEN" | grep -q '"budgetCents"'
          curl -sf -XPOST localhost:3333/api/budgets/alerts -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "{\"month\":\"$MES\"}" > /dev/null
          curl -sf -XPOST localhost:3333/api/assistant/chat -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"quanto ainda posso gastar no mercado?"}]}' | grep -q 'Alimentação'
          MCP_KEY=$(curl -sf -XPOST localhost:3333/api/tokens -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"CI","scope":"mcp"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf -XPOST localhost:3333/mcp -H "authorization: Bearer $MCP_KEY" -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q registrar_lancamentos

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium do Playwright
        run: npm exec -w web -- playwright install --with-deps chromium
      - name: Testes no celular emulado
        run: npm run e2e -w web
        env:
          CI: 'true'
      - name: Relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
