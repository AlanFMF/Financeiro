name: APK Android

# Gera o APK a cada envio para a main (ou manualmente em Actions, "Run workflow")
# e publica no GitHub Pages: alanfmf.github.io/Financeiro/saldo.apk
# (na primeira vez, ative em Settings, Pages, Source: GitHub Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build do app web
        env:
          # Endereço da API publicada no Render. Para trocar sem mexer no código, crie a variável
          # SALDO_API_URL em Settings, Secrets and variables, Actions, Variables.
          VITE_API_URL: ${{ vars.SALDO_API_URL || 'https://saldo-api-g1ae.onrender.com' }}
        run: npm run build -w web

      - name: Copia o app web para o projeto Android
        working-directory: web
        run: npx cap sync android

      - name: Chave de assinatura de produção (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Gera o APK
        working-directory: web/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/saldo.apk"

      - name: Monta a página de download
        run: |
          mkdir -p site
          cp saldo.apk site/saldo.apk
          cp web/public/icon.svg site/icon.svg
          TAMANHO="$(awk -v b="$(stat -c%s saldo.apk)" 'BEGIN { printf "%.1f MB", b / 1048576 }' | tr . ,)"
          DATA="$(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          sed -e "s|{{VERSAO}}|1.${{ github.run_number }}|g" -e "s|{{TAMANHO}}|$TAMANHO|g" -e "s|{{DATA}}|$DATA|g" \
            web/android/pages/index.html > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
